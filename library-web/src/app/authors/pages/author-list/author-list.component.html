<app-page-header title="Autores" [subtitle]="loading() ? 'Cargando autores…' : authors().length + ' autores registrados'">
  <button type="button" class="btn-primary" (click)="openCreate()">+ Nuevo autor</button>
</app-page-header>

<div class="card">
  <div class="border-b border-stone-200 p-4">
    <input
      type="search"
      class="form-input sm:max-w-xs"
      placeholder="Buscar por nombre…"
      [value]="search()"
      (input)="onSearch($any($event.target).value)"
    />
  </div>

  @if (loading()) {
    <app-loading-state text="Cargando autores…" />
  } @else if (loadFailed()) {
    <app-empty-state
      title="No se pudieron cargar los autores"
      description="Revisa que el API esté corriendo e intenta de nuevo."
      actionText="Reintentar"
      (action)="load()"
    />
  } @else if (filtered().length === 0) {
    <app-empty-state title="No hay autores que coincidan" description="Prueba con otro nombre." />
  } @else {
    <div class="overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead class="bg-stone-50 text-left text-xs uppercase tracking-wide text-stone-500">
          <tr>
            <th class="px-4 py-3 font-medium">Autor</th>
            <th class="px-4 py-3 text-center font-medium">Libros publicados</th>
            <th class="hidden px-4 py-3 font-medium sm:table-cell">Libro asociado</th>
            <th class="px-4 py-3"><span class="sr-only">Acciones</span></th>
          </tr>
        </thead>
        <tbody class="divide-y divide-stone-100">
          @for (author of visible(); track author.id) {
            <tr class="hover:bg-stone-50/60">
              <td class="px-4 py-3">
                <div class="flex items-center gap-3">
                  <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-brand-100 text-xs font-semibold text-brand-700">
                    {{ initials(author) }}
                  </span>
                  <span class="font-medium text-stone-900">{{ author.fullName }}</span>
                </div>
              </td>
              <td class="px-4 py-3 text-center">
                <span class="inline-flex min-w-[2rem] justify-center rounded-full bg-stone-100 px-2 py-0.5 text-xs font-semibold text-stone-700">
                  {{ author.booksCount }}
                </span>
              </td>
              <td class="hidden px-4 py-3 sm:table-cell">
                <a [routerLink]="['/books', author.idBook]" class="text-brand-700 hover:underline">Libro #{{ author.idBook }}</a>
              </td>
              <td class="whitespace-nowrap px-4 py-3 text-right">
                <button type="button" class="btn-ghost" (click)="openEdit(author)">Editar</button>
                <button type="button" class="btn-ghost-danger" (click)="toDelete.set(author)">Eliminar</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
    <app-pagination [page]="page()" [pageSize]="pageSize" [total]="filtered().length" (pageChange)="page.set($event)" />
  }
</div>

<app-modal [open]="formOpen()" [title]="editing() ? 'Editar autor' : 'Nuevo autor'" (closed)="closeForm()">
  <app-author-form [author]="editing()" [saving]="saving()" (save)="save($event)" (cancel)="closeForm()" />
</app-modal>

<app-confirm-dialog
  [open]="!!toDelete()"
  title="Eliminar autor"
  [message]="deleteMessage()"
  [busy]="deleting()"
  (confirmed)="delete()"
  (cancelled)="toDelete.set(null)"
/>
